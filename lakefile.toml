name = "FormalSnarksProject"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FormalSnarksProject"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# TODO: smt (lean-smt) temporarily dropped — no v4.30.0-compatible release yet, and it blocks
# the toolchain bump needed for the CompPoly FinEnum branch below. Restore once it's updated.
# [[require]]
# name = "smt"
# scope = "ufmg-smite"
# rev = "7d1d8239e78daa5197f9a71948776c4627049f5f"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "CompPoly"
git = "https://github.com/BoltonBailey/CompPoly"
rev = "8f00634637b1d19fbeda316f472d1d30cd7097a2" # branch cordmvpolynomial-sparse-core: COrdMvPolynomial sparse core

[[lean_lib]]
name = "FormalSnarksProject"
